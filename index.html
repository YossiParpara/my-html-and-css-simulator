<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>מעבדת קוד HTML & CSS - כלי להדגמה בכיתה</title>
  <style>
    :root {
      --bg-primary: #cbd5e1; --bg-surface: #f8fafc; --border-color: #475569;
      --text-main: #0f172a; --accent: #1d4ed8; --editor-font-size: 18px;
      --editor-lh: 29px;   /* גובה שורה בפיקסלים שלמים: מונע סטייה מצטברת בין העורך לצבעי הקוד */
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background-color: var(--bg-primary); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    header { background-color: var(--bg-surface); border-bottom: 4px solid var(--border-color); padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; gap: 20px; }
    .title-area small { display: block; font-size: 0.8rem; font-weight: 600; color: #475569; margin-top: 2px; }
    .title-area h1 { font-size: 1.5rem; color: var(--accent); font-weight: 800; }
    .topic-selector-area { display: flex; align-items: center; gap: 12px; flex: 1; max-width: 550px; }
    .topic-selector-area label { font-weight: 800; font-size: 1.1rem; white-space: nowrap; }
    #topic-select { width: 100%; background-color: #ffffff; border: 3px solid var(--accent); padding: 10px 16px; border-radius: 8px; font-weight: 800; font-size: 1.05rem; }
    .controls { display: flex; gap: 8px; }
    .btn-control { background-color: #ffffff; border: 2px solid var(--border-color); padding: 10px 16px; border-radius: 8px; cursor: pointer; font-size: 1rem; font-weight: 800; }
    .btn-control:hover { background-color: #e2e8f0; }
    .btn-save { background-color: #16a34a; border-color: #16a34a; color: white; }
    .btn-save:hover { background-color: #15803d; }

    main { display: grid; grid-template-columns: 1fr 1fr; flex: 1; min-height: 0; background-color: var(--border-color); gap: 5px; direction: ltr; }
    .pane-code, .pane-preview { background-color: #ffffff; display: flex; flex-direction: column; min-height: 0; }
    .pane-header { background-color: #e2e8f0; padding: 12px 20px; font-weight: 800; font-size: 1.1rem; border-bottom: 3px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; direction: rtl; }
    .tab-group { display: flex; gap: 6px; direction: ltr; }
    .tab-btn { padding: 6px 18px; border: 2px solid var(--border-color); background: #ffffff; cursor: pointer; font-weight: 800; border-radius: 6px; }
    .tab-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

    .editor-wrapper { position: relative; flex: 1; background: #ffffff; overflow: hidden; }
    textarea.code-editor, .highlight-layer {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; margin: 0; padding: 20px;
      font-family: 'Consolas', 'Courier New', monospace; font-size: var(--editor-font-size);
      line-height: var(--editor-lh); white-space: pre; tab-size: 2; box-sizing: border-box; font-weight: 600;
      border: none; letter-spacing: 0; direction: ltr; text-align: left;
      word-spacing: 0; text-indent: 0; text-transform: none; text-rendering: auto;
      font-variant-ligatures: none; font-kerning: none; font-synthesis: none;
      -webkit-text-size-adjust: none; text-size-adjust: none;
      -webkit-appearance: none; appearance: none; border-radius: 0;
    }
    textarea.code-editor { background: transparent; color: transparent; caret-color: #000000; resize: none; outline: none; z-index: 2; overflow: auto; }
    textarea.code-editor::selection { background: rgba(29, 78, 216, 0.25); }
    .highlight-layer { z-index: 1; background-color: #ffffff; pointer-events: none; overflow: hidden; }
    /* הגלילה של שכבת הצבעים נעשית ב-transform (לא ב-scrollTop), כדי שתמיד תהיה זהה לגלילת תיבת הטקסט */
    .highlight-layer code { font: inherit; letter-spacing: inherit; display: block; width: max-content; min-width: 100%; will-change: transform; }

    /* ===== עמודת תיבות הסימון (checkbox) לצד קוד ה-CSS ===== */
    #wrapper-html textarea.code-editor, #wrapper-html .highlight-layer, #wrapper-css textarea.code-editor, #wrapper-css .highlight-layer { left: 52px; width: calc(100% - 52px); }
    .gutter { position: absolute; top: 0; left: 0; bottom: 0; width: 52px; background: #f1f5f9; border-right: 3px solid #cbd5e1; overflow: hidden; z-index: 3; }
    .gutter-inner { position: absolute; top: 0; left: 0; right: 0; }
    .g-row { position: absolute; left: 0; right: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .g-row input { width: 22px; height: 22px; cursor: pointer; accent-color: #16a34a; }
    .g-row:hover { background: #dbeafe; }
    .g-row.rule { background: #e0e7ff; border-top: 1px solid #a5b4fc; }
    .g-row.rule input { width: 24px; height: 24px; accent-color: #1d4ed8; }
    .g-row.cov { opacity: 0.35; cursor: not-allowed; }
    .g-row.cov input { cursor: not-allowed; }
    .off { background: rgba(220, 38, 38, 0.12); opacity: 0.5; text-decoration: line-through; text-decoration-color: #dc2626; }
    #enable-all { background: #16a34a; border-color: #16a34a; color: white; }

    /* ===== צבעי Visual Studio Code (ערכת Light+) ===== */
    .c  { color: #008000; }               /* הערות - ירוק */
    .tg { color: #800000; }               /* תגיות HTML, סלקטורים ב-CSS - בורדו */
    .at { color: #e50000; }               /* שמות מאפיינים (HTML attributes / CSS properties) - אדום */
    .av { color: #0000ff; }               /* ערכי מאפיינים ב-HTML - כחול */
    .kw { color: #0451a5; }               /* ערכי מילים ב-CSS (flex, solid...) - כחול כהה */
    .nm { color: #098658; }               /* מספרים, יחידות וצבעי hex - ירוק כהה */
    .fn { color: #795e26; }               /* פונקציות (rgba, scale...) - חום */
    .st { color: #a31515; }               /* מחרוזות - אדום כהה */
    .ar { color: #af00db; }               /* @-rules ו-!important - סגול */

    .pane-preview { background-color: #94a3b8; }
    iframe#preview-output { width: 100%; max-width: 100%; align-self: center; flex: 1; border: none; background-color: #ffffff; transition: width 0.25s ease; }
    .device-group { display: flex; gap: 6px; }
    .dev { padding: 6px 12px; font-size: 0.9rem; }
    .dev.active { background-color: var(--accent); border-color: var(--accent); color: #ffffff; }
    .fullscreen-preview .pane-header { font-size: 1.2rem; }
    .fullscreen-preview { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999; }
  </style>
</head>
<body>
  <header>
    <div class="title-area"><h1>🎓 מעבדת HTML & CSS של יוסי פרפארה</h1><small>📁 התמונות נטענות מתיקיית Images שנמצאת ליד קובץ זה</small></div>
    <div class="topic-selector-area">
      <label for="topic-select">בחר נושא:</label>
      <select id="topic-select" onchange="onTopicChange(this.value)">
        <optgroup label="📂 יסודות ומבנה עיצוב">
          <option value="animals">1. 🎯 סלקטורים ב-CSS: לפי אלמנט, class ו-id (דף חיות)</option>
          <option value="boxModel">2. 📦 Box Model: margin, border, padding</option>
          <option value="imageText">3. 🖼️ שילוב תמונה וטקסט (Flexbox)</option>
          <option value="flexbox">4. Flexbox Layout</option>
        </optgroup>
        <optgroup label="✨ אפקטים, מעברים וגלריות תמונות">
          <option value="hoverDemo">5. 🖱️ אפקט Hover פשוט (כפתור)</option>
          <option value="focusActive">6. 🎯 אירועי עכבר ומקלדת: Focus ו-Active</option>
          <option value="singleCard">7. 🃏 כרטיסייה אחת (עיצוב מינימלי)</option>
          <option value="singleCardDetails">8. 📂 כרטיסייה אחת: קרא עוד עם details ו-summary</option>
          <option value="singleCardLink">9. 🔗 כרטיסייה אחת: קישור לעמוד אחר (Razor Pages)</option>
          <option value="singleCardToggle">10. 🔀 כרטיסייה אחת: קרא עוד / קרא פחות (עם checkbox)</option>
          <option value="threeCards">11. 🌟 גלריית 3 כרטיסיות (קרא עוד / קרא פחות)</option>
          <option value="cardPages">12. 📄 כרטיסיות שמובילות לעמוד נוסף</option>
          <option value="flipCard">13. Flip Card (אפקט 3D)</option>
          <option value="page2">14. Hover Gallery (אפקטי מעבר על תמונות)</option>
        </optgroup>
        <optgroup label="🌀 אנימציות וגרדיאנטים">
          <option value="page3">15. Infinite Animations (הקפצה והבהוב)</option>
          <option value="page4">16. Animated Gradient Background</option>
          <option value="page6">17. Parallax Hero Section</option>
        </optgroup>
        <optgroup label="🧩 טפסים, מבנה ו-Bootstrap (הכנה ל-Razor Pages)">
          <option value="formFields">18. 📝 שדות טופס (input, select, radio...)</option>
          <option value="layoutPage">19. 🏗️ מבנה דף כמו ב-Layout</option>
          <option value="dataTable">20. 📊 טבלת נתונים מעוצבת</option>
          <option value="bootstrapCards">21. 🅱️ Bootstrap: כרטיסיות ו-Grid</option>
        </optgroup>
      </select>
    </div>
    <div class="controls">
      <button class="btn-control btn-save" onclick="saveToFile()">💾 הורד קובץ</button>
      <button class="btn-control" onclick="adjustFontSize(2)">🔍 +פונט</button>
      <button class="btn-control" onclick="adjustFontSize(-2)">🔍 -פונט</button>
      <button class="btn-control" id="btn-comments" onclick="toggleComments()" title="מציג את הקוד בלי ההערות">🧹 הסתר הערות</button>
      <button class="btn-control" onclick="resetCurrentCode()">🔄 איפוס</button>
    </div>
  </header>
  <main id="main-container">
    <section class="pane-code">
      <div class="pane-header">
        <span>עורך קוד (בזמן אמת)</span>
        <div class="tab-group">
          <button class="tab-btn active" id="tab-html" onclick="switchTab('html')">HTML</button>
          <button class="tab-btn" id="tab-css" onclick="switchTab('css')">CSS</button>
          <button class="tab-btn" id="enable-all" onclick="enableAllLines()" title="החזרת כל השורות שכובו">☑ הפעל הכל</button>
        </div>
      </div>
      <div class="editor-wrapper">
        <div id="wrapper-html" style="position: absolute; width:100%; height:100%;">
          <div class="gutter" id="html-gutter" title="סמן/בטל כדי להפעיל או לכבות שורה"><div class="gutter-inner" id="html-gutter-inner"></div></div>
          <textarea id="editor-html" class="code-editor" spellcheck="false" wrap="off" autocomplete="off" autocorrect="off" autocapitalize="off" oninput="handleInput('html')" onscroll="handleScroll('html')"></textarea>
          <pre class="highlight-layer"><code id="code-html"></code></pre>
        </div>
        <div id="wrapper-css" style="position: absolute; width:100%; height:100%; display: none;">
          <div class="gutter" id="css-gutter" title="סמן/בטל כדי להפעיל או לכבות שורה"><div class="gutter-inner" id="css-gutter-inner"></div></div>
          <textarea id="editor-css" class="code-editor" spellcheck="false" wrap="off" autocomplete="off" autocorrect="off" autocapitalize="off" oninput="handleInput('css')" onscroll="handleScroll('css')"></textarea>
          <pre class="highlight-layer"><code id="code-css"></code></pre>
        </div>
      </div>
    </section>
    <section class="pane-preview" id="preview-panel">
      <div class="pane-header">
        <span>תוצאה חיה (Preview)</span>
        <div class="device-group">
          <button class="btn-control dev" onclick="setDevice('375px', this)">📱 נייד</button>
          <button class="btn-control dev" onclick="setDevice('768px', this)">📋 טאבלט</button>
          <button class="btn-control dev active" onclick="setDevice('100%', this)">💻 מחשב</button>
        </div>
        <button class="btn-control" id="fs-btn" onclick="toggleFullscreen()">🖥️ מסך מלא</button>
      </div>
      <iframe id="preview-output"></iframe>
    </section>
  </main>

  <script>

      animals: {
        html: `<h1>עולם החיות המופלא</h1>
<hr>

<p>ניווט מהיר: <a href="#lion">אריה</a> | <a href="#elephant">פיל</a></p>

<div class="card">

<\!--
  ===== הסבר על הקוד =====

  שלוש דרכים לבחור אלמנט ב-CSS:

  1. לפי אלמנט (שם התגית):  h1, p, a, body
     משפיע על כל האלמנטים מהסוג הזה בדף.
  2. לפי class (נקודה):  .card
     משפיע על כל מי שכתוב לו class="card". אפשר להשתמש בו שוב ושוב.
  3. לפי id (סולמית):  #lion
     משפיע על אלמנט אחד בלבד. ה-id חייב להיות ייחודי בדף.

  כשכמה כללים מתנגשים: id חזק מ-class, ו-class חזק משם אלמנט.
  .card h2 = בחירה לפי "מי בתוך מי": רק h2 שנמצא בתוך card.

  עוד תגיות: hr = קו מפריד (בודדת), p = פסקה, ul = רשימה,

  ===== נסו בעצמכם =====
  1. שנו את צבע ה-h1 וראו שמשתנה אלמנט אחד.

  3. כבו את הכלל #lion וראו שהכותרת חוזרת לצבע של .card h2.
  4. הוסיפו class="card" לפסקה בראש הדף וראו מה קורה.
--\>`,

body {                                  /* בוחר את כל גוף הדף */
  font-family: Arial, sans-serif;       /* גופן קריא וללא סריף */
  background-color: #f8fafc;            /* צבע רקע בהיר לדף */

      boxModel: {
        html: `<div class="margin-area">
  <div class="demo-box">
    <div class="demo-content">content</div>

</div>

<\!--
  ===== הסבר על הקוד =====

  כל אלמנט ב-HTML הוא קופסה בת ארבע שכבות, מבפנים החוצה:

  content = התוכן עצמו (כחול).
  padding = רווח בין התוכן למסגרת, בתוך הקופסה (ירוק).
  border  = המסגרת (כתום כהה).
  margin  = רווח בין הקופסה לאלמנטים שסביבה, מחוץ לקופסה (כתום בהיר).

  ההבדל החשוב: padding הוא בתוך המסגרת וצבע הרקע מתפשט אליו,
  ו-margin הוא מחוץ למסגרת והוא תמיד שקוף.

  קיצור: margin: 10px 20px = 10 למעלה ולמטה, 20 לימין ולשמאל.
  ארבעה ערכים: למעלה, ימין, למטה, שמאל (עם כיוון השעון).

  margin-area = אזור עזר צבוע בכתום בהיר, כדי שיהיה אפשר לראות את ה-margin.
  display: flow-root = מונע מה-margin של הילד "לברוח" מחוץ לאזור.

  טיפ: בדפדפן, לחיצה על F12 ובחירת אלמנט מציגה את אותו תרשים
  של ארבע השכבות, עם המספרים האמיתיים.

  ===== נסו בעצמכם =====
  1. שנו את padding מ-20px ל-50px ועקבו אחרי האזור הירוק.
  2. כבו את שורת margin וראו מה קורה לאזור הכתום הבהיר.
  3. שנו את border ל-30px dashed red.
  4. כתבו margin: 10px 60px (שני ערכים) וראו מה השתנה.
--\>`,

      imageText: {

        css: `/* עיצוב כללי: חישוב רוחב כולל מסגרת ומרווח פנימי */
* {                                     /* בוחר את כל האלמנטים בדף */
  box-sizing: border-box;               /* רוחב וגובה כוללים גם padding וגם border */
}

/* עיצוב גוף הדף הכהה ברקע */
body {                                  /* בוחר את כל גוף הדף */
  background-color: #0f172a;            /* רקע כחול כהה מאוד */
  font-family: Arial, sans-serif;       /* גופן קריא וללא סריף */
  padding: 30px 20px;                   /* מרווח פנימי: 30 למעלה/למטה, 20 לצדדים */
}

.container {                            /* המכולה הכללית של הגלריה */
  max-width: 1000px;                    /* הגבלת רוחב כדי שהגלריה לא תימתח */
  margin: 0 auto;                       /* מרכוז המכולה בדף */
}

.main-title {                           /* הכותרת הראשית של הגלריה */
  text-align: center;                   /* מרכוז הכותרת */
  font-size: 1.8rem;                    /* גודל יחסי לגודל הפונט של הדף */
  margin-bottom: 25px;                  /* מרווח חיצוני מתחת לכותרת */
  color: #38bdf8;                       /* צבע תכלת בהיר */
}

.cards-grid {                           /* המכולה של שלוש הכרטיסיות */
  display: flex;                        /* סידור הכרטיסיות בשורה */
  flex-wrap: wrap;                      /* אם אין מקום, כרטיסייה יורדת לשורה הבאה */
  justify-content: center;              /* מרכוז הכרטיסיות */
  align-items: flex-start;              /* כל כרטיסייה בגובה שלה: כשאחת נפתחת, האחרות לא נמתחות */
  gap: 20px;                            /* מרווח בין הכרטיסיות */
}

.modern-card {                          /* כל כרטיסייה */
  flex: 1 1 220px;                      /* גדלה וקטנה לפי המקום, רוחב בסיס 220px */
  max-width: 310px;                     /* רוחב מקסימלי לכרטיסייה */
  background: #f8fafc;                  /* רקע לבן-אפרפר */
  border-radius: 14px;                  /* עיגול פינות */
  overflow: hidden;                     /* חיתוך כל מה שיוצא מעבר לפינות המעוגלות */
  display: flex;                        /* Flexbox בתוך הכרטיסייה */
  flex-direction: column;               /* סידור התוכן בטור (מלמעלה למטה) */
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35); /* צל כהה מתחת לכרטיסייה */
  transition: transform 0.3s ease;      /* מעבר חלק בזמן ריחוף */
}

.modern-card:hover {                    /* הכרטיסייה בזמן שהעכבר מעליה */
  transform: translateY(-6px);          /* הרמת הכרטיסייה 6 פיקסלים כלפי מעלה */
}

.modern-card img {                      /* התמונה בתוך הכרטיסייה */
  width: 100%;                          /* התמונה ממלאת את כל רוחב הכרטיסייה */
  height: 160px;                        /* גובה קבוע לתמונה */
  object-fit: cover;                    /* חיתוך התמונה כך שתמלא את המסגרת בלי להימתח */
  background: #cbd5e1;                  /* רקע אפור למקרה שהתמונה לא נטענה */
}

.card-content {                         /* אזור הטקסט בכרטיסייה */
  padding: 18px;                        /* מרווח פנימי */
  display: flex;                        /* Flexbox */
  flex-direction: column;               /* סידור האלמנטים בטור */
}

.card-content h3 {                      /* כותרת הכרטיסייה */
  font-size: 20px;                      /* גודל הכותרת */
  margin-bottom: 8px;                   /* מרווח חיצוני מתחת */
  color: #0f172a;                       /* צבע כהה */
}

.card-content p {                       /* הטקסט בכרטיסייה (גם הקצר וגם הנוסף) */
  font-size: 15px;                      /* גודל טקסט נוח לקריאה */
  color: #475569;                       /* צבע אפור */
  line-height: 1.6;                     /* גובה שורה */
  margin-bottom: 16px;                  /* מרווח מתחת לפסקה */
}

/* ===== קרא עוד / קרא פחות ===== */
.toggle {                               /* תיבת הסימון הנסתרת */
  position: absolute;                   /* מוציאה את התיבה מהסידור, כדי שלא תתפוס מקום */
  opacity: 0;                           /* שקופה לגמרי, אבל עדיין קיימת ופועלת */
  pointer-events: none;                 /* לא מגיבה ללחיצה ישירה (לוחצים על הכפתור) */
}

.more-text {                            /* הטקסט הנוסף */
  display: none;                        /* מוסתר כברירת מחדל */
}

.toggle:checked ~ .more-text {          /* כשהתיבה מסומנת: ~ בוחר את .more-text שבא אחריה */
  display: block;                       /* הטקסט הנוסף מוצג */
}

.txt-less {                             /* הכיתוב "קרא פחות" */

  flip-card-front / flip-card-back = החזית והגב של הקלף.

  איך זה עובד: כשהעכבר מעל המסגרת, ה-CSS מסובב את flip-card-inner
  ב-180 מעלות, ו-backface-visibility מסתיר את הצד שפונה אחורה.

  שימו לב: בנייד אין ריחוף עכבר, ולכן ההתנהגות שם שונה
  (נוגעים במקום לרחף).

  ===== נסו בעצמכם =====
  1. שנו rotateY ל-rotateX.

        css: `/* עיצוב גוף הדף במרכז */
body {                                  /* בוחר את כל גוף הדף */
  display: flex;                        /* הפעלת Flexbox */
  justify-content: center;              /* מרכוז אופקי */
  align-items: center;                  /* מרכוז אנכי */
  height: 90vh;                         /* גובה של 90% מגובה החלון */
  background: linear-gradient(135deg, #1e1b4b, #312e81); /* רקע סגול כהה בגרדיאנט */
}

.flip-card {                            /* המסגרת החיצונית של הקלף */
  perspective: 1000px;                  /* עומק תלת-ממדי (כמה רחוק המצלמה) */
  width: 200px;                         /* רוחב הקלף */
  height: 200px;                        /* גובה הקלף */
}

.flip-card-inner {                      /* המעטפת שמסתובבת */
  position: relative;                   /* נקודת ייחוס לשני צידי הקלף */
  width: 100%;                          /* ממלא את כל רוחב הקלף */
  height: 100%;                         /* ממלא את כל גובה הקלף */
  transition: transform 0.8s;           /* סיבוב חלק לאורך 0.8 שניות */
  transform-style: preserve-3d;         /* שומר על ההשפעה התלת-ממדית של הילדים */
}

.flip-card:hover .flip-card-inner {     /* כשהעכבר מעל הקלף, משפיע על המעטפת הפנימית */
  transform: rotateY(180deg);           /* סיבוב של 180 מעלות סביב הציר האנכי */
}

.flip-card-front,
.flip-card-back {                       /* שני צידי הקלף (חזית וגב) יחד */
  position: absolute;                   /* שני הצדדים ממוקמים אחד על השני */
  width: 100%;                          /* ממלא את כל רוחב הקלף */
  height: 100%;                         /* ממלא את כל גובה הקלף */
  backface-visibility: hidden;          /* הסתרת הצד האחורי של כל צד בזמן הסיבוב */
  border-radius: 12px;                  /* עיגול פינות */
  display: flex;                        /* Flexbox למרכוז הכיתוב */
  justify-content: center;              /* מרכוז אופקי */
  align-items: center;                  /* מרכוז אנכי */
  color: white;                         /* טקסט לבן */
  font-size: 28px;                      /* גודל טקסט */
  font-weight: bold;                    /* כתב מודגש */
  text-shadow: 0 2px 6px black;         /* צל לטקסט כדי שייקרא על התמונה */
}

.flip-card-front {                      /* חזית הקלף */
  background: url('Images/nature.jpg') center/cover; /* תמונת רקע ממורכזת שממלאת את הקלף */
}

.flip-card-back {                       /* גב הקלף */
  background: url('Images/mountain.jpg') center/cover; /* תמונת רקע אחרת */
  transform: rotateY(180deg);           /* הגב מוסתב מראש כך שיופיע נכון אחרי הסיבוב */
}`

    const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const span = (cls, t) => t.split('\n').map(x => x ? `<span class="${cls}">${esc(x)}</span>` : '').join('\n');

    function run(text, re, fn) {

      re.lastIndex = 0;
      while ((m = re.exec(text))) {
        out += esc(text.slice(last, m.index)) + fn(m);
        last = m.index + m[0].length;
        if (m[0].length === 0) re.lastIndex++;
      }
      return out + esc(text.slice(last));
    }

    // רצפי התווים של הערת HTML נבנים מחלקים, כדי שלא יופיעו כמות שהם בתוך תגית ה-script
    const CMT_OPEN = '<' + '!--';
    const CMT_CLOSE = '--' + '>';
    const TAG_RE = new RegExp(CMT_OPEN + '[\\s\\S]*?(?:' + CMT_CLOSE + '|$)|<![^>]*>?|<\\/?[a-zA-Z][^>]*>?', 'g');
    const ATTR_RE = /([^\s=]+)(\s*=\s*)("[^"]*"|'[^']*'|[^\s"'>]+)?/g;

    function highlightAttr(a) {
      return span('at', a[1]) + (a[2] ? esc(a[2]) : '') + (a[3] ? span('av', a[3]) : '');
    }

    function highlightTag(m) {
      const s = m[0];
      if (s.startsWith(CMT_OPEN)) return span('c', s);
      if (s.startsWith('<!')) return span('av', s);
      const t = s.match(/^(<\/?)([\w:-]*)([\s\S]*?)(\/?>?)$/);
      if (!t) return esc(s);
      return span('tg', t[1]) + span('tg', t[2]) + run(t[3], ATTR_RE, highlightAttr) + span('tg', t[4]);
    }

    function highlightHTML(src) {
      return run(src, TAG_RE, highlightTag);
    }

    function highlightSelector(text) {
      return run(text, /(@[\w-]+)|(\d+(?:\.\d+)?%)|(::?[\w-]+(?:\([^)]*\))?)|([.#][\w-]+)|([\w-]+)|(\*)/g,
        m => span(m[1] ? 'ar' : m[2] ? 'nm' : 'tg', m[0]));
    }

    function highlightValue(text) {

           : m[3] ? span('nm', m[0])

          out += span('c', src.slice(i, end)); i = end; continue;

        if (ch === '}') { out += '}'; depth = Math.max(0, depth - 1); mode = 'prop'; i++; continue; }

            if (k === -1) rest = ''; else { rest = rest.slice(k + CMT_CLOSE.length); inCmt = false; }
          } else {
            const k = rest.indexOf(CMT_OPEN);
            if (k === -1) { visible += rest; rest = ''; } else { visible += rest.slice(0, k); rest = rest.slice(k + CMT_OPEN.length); inCmt = true; }
          }
        }
        decl.push(visible.replace(/<\/[^>]*>/g, '').trim() !== '');   // שורה של תגית סוגרת בלבד אינה נחשבת
        const re = /<(\/?)([a-zA-Z][\w:-]*)[^>]*?(\/?)>/g;
        let m;
        while ((m = re.exec(visible))) {
          const closing = m[1] === '/', tag = m[2].toLowerCase();
          if (closing) {
            for (let k = stack.length - 1; k >= 0; k--) {
              if (stack[k].tag === tag) {
                const it = stack.splice(k)[0];
                if (it.line < i) rules.push({ start: it.line, end: i });
                break;
              }
            }
          } else if (!m[3] && !VOID_TAGS.test(tag)) stack.push({ tag, line: i });
        }
      });
      return { decl, rules };
    }
    const parseCode = (t, text) => t === 'html' ? parseHTML(text) : parseCSS(text);

    // כל השורות שכבויות כרגע: שורות בודדות + כל השורות שבתוך כלל/אלמנט כבוי
    function offSet(t) {
      const st = STATE[t], off = new Set(st.lines);
      st.parsed.rules.forEach(r => {
        if (st.rules.has(r.start)) for (let i = r.start; i <= r.end; i++) off.add(i);
      });
      return off;
    }

    function renderGutter(t) {
      if (!t) { renderGutter('html'); renderGutter('css'); return; }
      const ta = document.getElementById('editor-' + t), st = STATE[t];
      const lh = editorLineHeight();
      st.parsed = parseCode(t, ta.value);
      const ruleAt = new Map();
      st.parsed.rules.forEach(r => {
        const prev = ruleAt.get(r.start);
        if (!prev || r.end > prev.end) ruleAt.set(r.start, r);
      });
      st.lines = new Set([...st.lines].filter(i => st.parsed.decl[i]));
      st.rules = new Set([...st.rules].filter(i => ruleAt.has(i)));
      // האם שורה נמצאת בתוך כלל אחר שכבוי (ואז אי אפשר לשנות אותה בנפרד)
      const covered = (i, own) => st.parsed.rules.some(r => st.rules.has(r.start) && r.start !== own && i >= r.start && i <= r.end);
      const what = t === 'html' ? 'האלמנט כולו' : 'הכלל כולו';
      let h = '';
      st.parsed.decl.forEach((isDecl, i) => {
        const pos = `top:${20 + i * lh}px;height:${lh}px`;
        if (ruleAt.has(i)) {
          const cov = covered(i, i);
          h += `<label class="g-row rule${cov ? ' cov' : ''}" style="${pos}" title="כיבוי/הפעלה של ${what}"><input type="checkbox" data-type="${t}" data-rule="${i}" ${st.rules.has(i) ? '' : 'checked'} ${cov ? 'disabled' : ''}></label>`;
        } else if (isDecl) {
          const cov = covered(i, -1);
          h += `<label class="g-row${cov ? ' cov' : ''}" style="${pos}" title="כיבוי/הפעלה של שורה זו"><input type="checkbox" data-type="${t}" data-line="${i}" ${st.lines.has(i) ? '' : 'checked'} ${cov ? 'disabled' : ''}></label>`;
        }
      });
      const inner = document.getElementById(t + '-gutter-inner');
      inner.innerHTML = h;
      inner.style.transform = `translateY(${-ta.scrollTop}px)`;
    }

    document.addEventListener('change', e => {
      const d = e.target.dataset;
      if (!d || !d.type || (d.line === undefined && d.rule === undefined)) return;
      const isRule = d.rule !== undefined, st = STATE[d.type];
      const set = isRule ? st.rules : st.lines;
      const i = +(isRule ? d.rule : d.line);
      if (e.target.checked) set.delete(i); else set.add(i);
      renderGutter(d.type); triggerHighlight(d.type); updatePreview();
    });

    function enableAllLines() {
      clearDisabled(activeTab);
      renderGutter(activeTab); triggerHighlight(activeTab); updatePreview();
    }

    // כשמוסיפים/מוחקים שורות בעורך, מזיזים את מספרי השורות הכבויות בהתאם
    function shiftSet(set, c, delta) {
      const next = new Set();
      set.forEach(i => {
        if (i > c - delta) next.add(i + delta);
        else if (delta < 0 && i > c) { /* השורה נמחקה */ }
        else next.add(i);
      });
      return next;
    }

    function shiftDisabled(t) {
      const ta = document.getElementById('editor-' + t), st = STATE[t];
      const n = countLines(t), delta = n - st.prev;
      if (delta !== 0) {
        const c = ta.value.slice(0, ta.selectionStart).split('\n').length - 1;
        st.lines = shiftSet(st.lines, c, delta);
        st.rules = shiftSet(st.rules, c, delta);
      }
      st.prev = n;
    }

    function codeForPreview(t) {
      const off = offSet(t);
      return document.getElementById('editor-' + t).value.split('\n').filter((_, i) => !off.has(i)).join('\n');
    }
    const cssForPreview = () => codeForPreview('css');
    const htmlForPreview = () => codeForPreview('html');

    function handleInput(type) {
      shiftDisabled(type); renderGutter(type);
      triggerHighlight(type); updatePreview();
    }

    function triggerHighlight(t) {
      const textarea = document.getElementById(`editor-${t}`);
      const codeBlock = document.getElementById(`code-${t}`);
      let text = textarea.value;
      if (text.endsWith("\n")) { text += " "; }
      const off = offSet(t);
      codeBlock.innerHTML = (t === 'html' ? highlightHTML(text) : highlightCSS(text))
        .split('\n').map((l, i) => off.has(i) ? `<span class="off">${l}</span>` : l).join('\n');
      handleScroll(t);
      // הדפדפן גולל את תיבת הטקסט (כדי להשאיר את הסמן בתצוגה) מעט אחרי אירוע ההקלדה, לכן מסנכרנים שוב בפריים הבא
      lastScroll[t] = [-1, -1];
      requestAnimationFrame(() => handleScroll(t));
    }

    function handleScroll(type) {
      const textarea = document.getElementById(`editor-${type}`);
      const code = document.getElementById(`code-${type}`);
      code.style.transform = `translate(${-textarea.scrollLeft}px, ${-textarea.scrollTop}px)`;
      document.getElementById(`${type}-gutter-inner`).style.transform = `translateY(${-textarea.scrollTop}px)`;
    }

    // בתצוגה החיה (srcdoc) קישור כמו href="#lion" היה טוען מחדש את כל המעבדה בתוך התצוגה.
    // הסקריפט הזה מבצע קפיצה בתוך אותו דף (חשוב גם ל-:target). הוא מתווסף רק לתצוגה, לא לקובץ שמורידים.
    const PREVIEW_ANCHOR_FIX = '<scr' + 'ipt>var LAB_URL=' + JSON.stringify(location.href) + ';document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[href]");if(!a)return;var h=a.getAttribute("href");if(h.charAt(0)!=="#"){if(/^(https?:|mailto:|tel:)/.test(h))return;e.preventDefault();window.open(new URL(h,LAB_URL).href,"_blank");return;}e.preventDefault();var id=h.slice(1);location.hash=id;if(id){var t=document.getElementById(id);if(t&&t.scrollIntoView)t.scrollIntoView();}else{window.scrollTo(0,0);}});</scr' + 'ipt>';
    function buildPage(h, c, forPreview) {
      return `<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><style>${c}</style></head><body>${h}${forPreview ? PREVIEW_ANCHOR_FIX : ''}</body></html>`;
    }

    function updatePreview() {
      const html = htmlForPreview();
      const css = cssForPreview();
      document.getElementById('preview-output').srcdoc = buildPage(html, css, true);
    }

    function adjustFontSize(amount) {
      currentFontSize = Math.max(12, currentFontSize + amount);
      applyEditorMetrics();
      renderGutter(); syncAll();
    }

    /* ===== תצוגה במכשירים שונים ===== */
    function setDevice(width, btn) {
      document.getElementById('preview-output').style.width = width;
      document.querySelectorAll('.dev').forEach(b => b.classList.toggle('active', b === btn));
    }

    /* ===== הסתרת הערות (קוד נקי להצגה בכיתה) ===== */
    let cleanStash = null;
    function stripCssComments(t) {
      const noC = l => l.replace(/\/\*[\s\S]*?\*\//g, '');
      return t.split('\n').filter(l => !(l.includes('/*') && noC(l).trim() === '')).map(l => noC(l).trimEnd()).join('\n');
    }
    function stripHtmlComments(t) {
      return t.replace(new RegExp(CMT_OPEN + '[\\s\\S]*?' + CMT_CLOSE, 'g'), '').replace(/\n{3,}/g, '\n\n').trim();
    }
    function toggleComments() {
      const h = document.getElementById('editor-html'), c = document.getElementById('editor-css');
      const b = document.getElementById('btn-comments');
      if (!cleanStash) {
        cleanStash = { html: h.value, css: c.value };
        h.value = stripHtmlComments(h.value); c.value = stripCssComments(c.value);
        b.textContent = '💬 הצג הערות';
      } else {
        const edited = h.value !== stripHtmlComments(cleanStash.html) || c.value !== stripCssComments(cleanStash.css);
        if (edited && !confirm('בוצעו שינויים בקוד בזמן שההערות היו מוסתרות. החזרת ההערות תמחק אותם. להמשיך?')) return;
        h.value = cleanStash.html; c.value = cleanStash.css; cleanStash = null;
        b.textContent = '🧹 הסתר הערות';
      }
      clearDisabled('html'); clearDisabled('css');
      STATE.html.prev = countLines('html'); STATE.css.prev = countLines('css');
      renderGutter(); triggerHighlight('html'); triggerHighlight('css'); updatePreview();
    }

    function resetCurrentCode() { onTopicChange(document.getElementById('topic-select').value); }
    function setFullscreen(on) {
      document.getElementById('preview-panel').classList.toggle('fullscreen-preview', on);
      document.getElementById('fs-btn').textContent = on ? '⬅ חזרה למסך מפוצל' : '🖥️ מסך מלא';
    }
    function toggleFullscreen() {
      setFullscreen(!document.getElementById('preview-panel').classList.contains('fullscreen-preview'));
    }

    function saveToFile() {
      const h = htmlForPreview();
      const c = cssForPreview();
      const blob = new Blob([buildPage(h, c)], { type: 'text/html' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'index.html'; a.click();
    }

    // Tab מכניס רווחים בעורך, Esc יוצא ממסך מלא
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') setFullscreen(false);
      if (e.key === 'Tab' && e.target.classList.contains('code-editor')) {
        e.preventDefault();
        const ta = e.target, s = ta.selectionStart;
        ta.value = ta.value.slice(0, s) + '  ' + ta.value.slice(ta.selectionEnd);
        ta.selectionStart = ta.selectionEnd = s + 2;
        ta.dispatchEvent(new Event('input'));
      }
    });

    window.onload = init;
  </script>
</body>
</html>
